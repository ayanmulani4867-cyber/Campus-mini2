<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - Campus Connect</title>
  <link rel="stylesheet" href="css/style.css?v=50">
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand-wrap">
      <span class="menu-btn" id="menuBtn">&#9776;</span>
      <a href="dashboard.html" class="logo">
        <span>🎓</span>
        <span>Campus Connect</span>
      </a>
    </div>

    <div class="topbar-actions">
      <div class="role-switch-box">
        <span>Role:</span>
        <select id="globalRoleSelect">
          <option value="student" {% if current_user and current_user.role == 'student' %}selected{% endif %}>Student</option>
          <option value="faculty" {% if current_user and current_user.role == 'faculty' %}selected{% endif %}>Faculty</option>
          <option value="admin" {% if current_user and current_user.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
      </div>

      <a href="profile.html" class="user-chip">
        <div class="user-avatar-mini" id="topbarAvatar">{{ current_user.full_name[0] if current_user else '' }}</div>
        <span id="topbarUserName">{{ current_user.full_name if current_user else '' }}</span>
      </a>
    </div>
  </header>

  <div class="dashboard-wrap">
    
    <!-- Mobile Drawer Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading">Navigation</div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Courses & Academic Curriculum</h2>
          <p>Explore enrolled subjects, syllabus schedules and course progress</p>
        </div>
        <div class="page-actions">
          <span class="badge badge-primary">Spring 2026</span>
        </div>
      </div>

      <!-- Search & Filter Bar -->
      <div class="filter-bar">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearchInput" placeholder="Search course title, code or instructor...">
        </div>
        <button class="btn btn-primary btn-sm filter-btn active" data-filter="all">All Courses</button>
        <button class="btn btn-secondary btn-sm filter-btn" data-filter="core">Core Theory</button>
        <button class="btn btn-secondary btn-sm filter-btn" data-filter="lab">Practical Labs</button>
      </div>

      <!-- Courses Grid -->
      <div class="grid-3" id="coursesContainer">
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Campus Connect</p>
  </footer>

  <script src="js/script.js?v=50"></script>
</body>
</html>
